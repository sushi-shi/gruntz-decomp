# units.toml - the per-translation-unit build manifest (single source of truth).
#
# PURE DATA - no prose. Per-unit rationale (why a TU exists / was split / absorbed
# another) lives in docs/tu-partition-brief.md; the compile-flag evidence lives in
# docs/linker-flags.md. This file is machine-edited in bulk, so comments here both
# rot and get eaten by sweeps.
#
# [build]  global toolchain config, passed through to the objdiff scratch block.
# [flags]  named profiles; every [[unit]] picks one by name. A profile is the FULL
#          flag set - there are no per-unit bolt-ons (configure.py rejects `extra`).
#            c         vendor C (zlib): /O2 /MT. /GX and /GR are meaningless in C.
#            cpp       the game's C++ project setting: /O2 /MT /GX.
#            cpp-rtti  cpp + /GR - the Gruntz project (retail's vtables carry a
#                      Complete Object Locator at [-4]; the engine libs' do not).
# [[unit]] unit (stem; must match symbol_names.csv's unit column), source, flags.
#
# Add a TU: add an [[unit]] block, re-run `python3 configure.py`, then `ninja`.

[build]
compiler = "msvc5.0"
platform = "win32"

[flags]
c        = ["/nologo", "/c", "/O2", "/MT"]
cpp      = ["/nologo", "/c", "/O2", "/MT", "/GX"]
cpp-rtti = ["/nologo", "/c", "/O2", "/MT", "/GX", "/GR"]
# Retail's movinglogic unit has ZERO EH frames while every sibling has them:
# it was compiled with RTTI but without /GX (proven by insn_count --eh).
cpp-rtti-noeh = ["/nologo", "/c", "/O2", "/MT", "/GR"]
# Bute's two container globals: retail's `$E` dynamic-init helpers carry the ctor and
# dtor bodies INLINE, which MSVC 5 only does without /GX (proven by probe - see
# docs/patterns/gx-blocks-ctor-inlining-into-e-helper.md).
cpp-noeh = ["/nologo", "/c", "/O2", "/MT"]


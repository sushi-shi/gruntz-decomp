# units.toml - the per-translation-unit build manifest (single source of truth).
#
# This file is per-TU; it is the counterpart to build/gen/symbol_names.csv, which
# is per-FUNCTION (rva,name,unit). Every `unit` here MUST line up with a `unit`
# value used in symbol_names.csv so the recompiled base object pairs with the
# delinked target object of the same name. configure.py reads this manifest and
# emits build.ninja + the objdiff project JSON.
#
# [build]  - global toolchain config: compiler/platform pass through to the
#            objdiff scratch block.
# [flags]  - named flag profiles (full flag sets); EVERY [[unit]] selects one via
#            `flags = "<name>"`. The names are SEMANTIC, because the split turned
#            out to be one of language/project, not a per-file toggle:
#              `c`        vendor C (zlib). /O2 /MT. /GX and /GR are meaningless
#                         here - there is no C++ EH and no polymorphism.
#              `cpp`      the game's C++ project setting: /O2 /MT /GX.
#              `cpp-rtti` `cpp` + /GR, for the Gruntz project (see the /GR note).
#            The locked VC5 defaults (/O2 /MT, cdecl) are in docs/zlib-matching.md.
#
# WHY /GX IS ON EVERYWHERE - measured, not assumed. Retail's own EH tables decide
# it: walk `__ehfuncinfo` (magic 0x19930520) -> its `__ehhandler` stub
# (`mov eax,<FuncInfo>; jmp __CxxFrameHandler`) -> the `push offset <stub>` in the
# owning function. Retail has 980 FuncInfo / 972 stubs / 790 attributable pushes,
# and 741 of those land in 186 of our TUs - every one already on /GX. The old
# `base` profile held 121 src/ TUs, of which 86 are .text-IDENTICAL either way and
# ALL 121 emit zero EH tables even when compiled /GX, so they never carried any
# evidence. The two decidable ones both came out /GX-ON: `fonts` 82.30 -> 100.00,
# and `gametext`, whose apparent /GX-OFF preference was a planted
# `volatile i32 slot = 0;` emulating the init that /GX emits by itself.
# [[unit]] - one TU: `unit` (stem; obj is <unit>.obj, target <unit>.c.obj; must
#            match symbol_names.csv's unit column), `source` (repo-relative path),
#            and `flags` (a [flags] profile name). Pick the profile whose FULL set
#            you need. A profile IS the whole flag set - there is no bolt-on
#            mechanism, by design (configure.py rejects a stray `extra` key).
#
# /GR (RTTI) is a PROFILE choice (`cpp-rtti`), exactly like /GX. MSVC5
# enables RTTI only under /GR (default OFF), so a polymorphic class compiled
# without it emits a vtable with NO Complete Object Locator - which is what
# retail's NON-RTTI vtables look like. An RTTI class carries a COL at vtable-4
# plus the ??_R0..R4 tree, and only /GR emits those.
#
# WHICH UNITS WANT IT - measured from retail, not guessed. `gruntz.core.vtable_scan`
# finds vtables independently of RTTI, so it sees COL-less ones; retail splits
# 192 with a COL / 73 without, and attributing each to its owning TU gives:
#     Gruntz    105 RTTI /  2 no-COL   -> the game project was built /GR
#     DDrawMgr    0 RTTI / 14 no-COL   -> engine projects were NOT
#     Rez         0 /  4      Dsndmgr  0 / 2      Bute  0 / 1
# i.e. the devs set /GR PER-PROJECT, matching the leaked C:\Proj\{...} layout.
# So `cpp-rtti` belongs on src/Gruntz TUs and NOT on the engine modules.
# /GR is .text-NEUTRAL (A/B verified): it only adds .rdata$r, grows .data with the
# type descriptors, and prepends the 4-byte COL to each ??_7. See docs/vtable-map.md.
#
# Add a TU: add an [[unit]] block here (+ its functions to symbol_names.csv), then
# re-run `python3 configure.py` and `ninja`.

[build]
compiler = "msvc5.0"
platform = "win32"

[flags]
c        = ["/nologo", "/c", "/O2", "/MT"]
cpp      = ["/nologo", "/c", "/O2", "/MT", "/GX"]
cpp-rtti = ["/nologo", "/c", "/O2", "/MT", "/GX", "/GR"]

